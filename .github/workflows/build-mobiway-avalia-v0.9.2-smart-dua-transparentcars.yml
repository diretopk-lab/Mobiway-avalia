name: Build MOBIWAY Avalia v0.9.2 Smart DUA + TransparentCars

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'MOBIWAY_Avalia_v0.9.2_SMART_DUA_TRANSPARENTCARS_SOURCE.zip'
      - '.github/workflows/build-mobiway-avalia-v0.9.2-smart-dua-transparentcars.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: |
          rm -rf avalia-build
          mkdir avalia-build
          unzip -q MOBIWAY_Avalia_v0.9.2_SMART_DUA_TRANSPARENTCARS_SOURCE.zip -d avalia-build
          if [ -d avalia-build/avalia ]; then
            cp -a avalia-build/avalia/. avalia-build/
            rm -rf avalia-build/avalia
          fi

      - name: Build APK
        run: gradle -p avalia-build :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp avalia-build/app/build/outputs/apk/debug/app-debug.apk MOBIWAY-Avalia-v0.9.2-SMART-DUA-TRANSPARENTCARS.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MOBIWAY-Avalia-v0.9.2-SMART-DUA-TRANSPARENTCARS-APK
          path: MOBIWAY-Avalia-v0.9.2-SMART-DUA-TRANSPARENTCARS.apk
          if-no-files-found: error
          retention-days: 30

name: Build MOBIWAY Cloud Ready

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'MOBIWAY_Avalia_v0.9.4_CLOUD_READY_SOURCE.zip'
      - 'MOBIWAY_REPAIR_v0.10.1_CLOUD_READY_SOURCE.zip'
      - '.github/workflows/build-mobiway-cloud-ready.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract sources
        run: |
          rm -rf avalia-build repair-build
          mkdir avalia-build repair-build
          unzip -q MOBIWAY_Avalia_v0.9.4_CLOUD_READY_SOURCE.zip -d avalia-build
          unzip -q MOBIWAY_REPAIR_v0.10.1_CLOUD_READY_SOURCE.zip -d repair-build

      - name: Validate Firebase integration
        run: |
          test -f avalia-build/app/google-services.json
          test -f repair-build/repair/app/google-services.json
          grep -q "versionName '0.9.4-cloud-ready'" avalia-build/app/build.gradle
          grep -q "versionName '0.10.1-cloud-ready'" repair-build/repair/app/build.gradle
          ! grep -q 'Firebase Project ID' avalia-build/app/src/main/assets/www/mobiway-cloud.js
          ! grep -q 'Firebase Project ID' repair-build/repair/app/src/main/assets/www/mobiway-cloud.js
          node --check avalia-build/app/src/main/assets/www/mobiway-cloud.js
          node --check repair-build/repair/app/src/main/assets/www/mobiway-cloud.js

      - name: Build Avalia
        run: gradle -p avalia-build :app:assembleDebug --stacktrace

      - name: Build Repair
        run: gradle -p repair-build/repair :app:assembleDebug --stacktrace

      - name: Prepare APKs
        run: |
          cp avalia-build/app/build/outputs/apk/debug/app-debug.apk MOBIWAY-Avalia-v0.9.4-CLOUD-READY.apk
          cp repair-build/repair/app/build/outputs/apk/debug/app-debug.apk MOBIWAY-REPAIR-v0.10.1-CLOUD-READY.apk

      - name: Upload Avalia APK
        uses: actions/upload-artifact@v4
        with:
          name: MOBIWAY-Avalia-v0.9.4-CLOUD-READY-APK
          path: MOBIWAY-Avalia-v0.9.4-CLOUD-READY.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Repair APK
        uses: actions/upload-artifact@v4
        with:
          name: MOBIWAY-REPAIR-v0.10.1-CLOUD-READY-APK
          path: MOBIWAY-REPAIR-v0.10.1-CLOUD-READY.apk
          if-no-files-found: error
          retention-days: 30

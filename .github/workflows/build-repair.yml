name: Build MOBIWAY REPAIR APK v0.4

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'MOBIWAY_REPAIR_ANDROID_v0.4_SOURCE.zip'
      - '.github/workflows/build-repair.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract REPAIR v0.4 source
        run: |
          rm -rf repair-build
          mkdir repair-build
          unzip -q MOBIWAY_REPAIR_ANDROID_v0.4_SOURCE.zip -d repair-build
      - name: Build debug APK
        run: gradle -p repair-build assembleDebug
      - name: Rename APK
        run: cp repair-build/app/build/outputs/apk/debug/app-debug.apk MOBIWAY-REPAIR-v0.4.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MOBIWAY-REPAIR-v0.4-APK
          path: MOBIWAY-REPAIR-v0.4.apk

name: Build MOBIWAY Photo Sync - Avalia v0.6.1 + Repair v0.7.1

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'MOBIWAY_Avalia_v0.6.1_PHOTO_SYNC_SOURCE.zip'
      - 'MOBIWAY_REPAIR_ANDROID_v0.7.1_PHOTO_SYNC_ICON_SOURCE.zip'
      - '.github/workflows/build-mobiway-photo-sync.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract projects
        run: |
          rm -rf avalia-build repair-build
          mkdir avalia-build repair-build
          unzip -q MOBIWAY_Avalia_v0.6.1_PHOTO_SYNC_SOURCE.zip -d avalia-build
          unzip -q MOBIWAY_REPAIR_ANDROID_v0.7.1_PHOTO_SYNC_ICON_SOURCE.zip -d repair-build

      - name: Build MOBIWAY Avalia v0.6.1
        run: gradle -p avalia-build :app:assembleDebug --stacktrace

      - name: Build MOBIWAY Repair v0.7.1
        run: gradle -p repair-build :app:assembleDebug --stacktrace

      - name: Prepare APKs
        run: |
          cp avalia-build/app/build/outputs/apk/debug/app-debug.apk MOBIWAY-Avalia-v0.6.1-PHOTO-SYNC.apk
          cp repair-build/app/build/outputs/apk/debug/app-debug.apk MOBIWAY-REPAIR-v0.7.1-PHOTO-SYNC-ICON.apk

      - name: Upload MOBIWAY Avalia APK
        uses: actions/upload-artifact@v4
        with:
          name: MOBIWAY-Avalia-v0.6.1-PHOTO-SYNC-APK
          path: MOBIWAY-Avalia-v0.6.1-PHOTO-SYNC.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload MOBIWAY Repair APK
        uses: actions/upload-artifact@v4
        with:
          name: MOBIWAY-REPAIR-v0.7.1-PHOTO-SYNC-ICON-APK
          path: MOBIWAY-REPAIR-v0.7.1-PHOTO-SYNC-ICON.apk
          if-no-files-found: error
          retention-days: 30

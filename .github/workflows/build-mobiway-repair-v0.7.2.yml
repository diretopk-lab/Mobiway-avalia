name: Build MOBIWAY REPAIR v0.7.2 - Online Budget Fix

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'MOBIWAY_REPAIR_ANDROID_v0.7.2_ONLINE_BUDGET_FIX_SOURCE.zip'
      - '.github/workflows/build-mobiway-repair-v0.7.2.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract REPAIR v0.7.2
        run: |
          rm -rf repair-build
          mkdir repair-build
          unzip -q MOBIWAY_REPAIR_ANDROID_v0.7.2_ONLINE_BUDGET_FIX_SOURCE.zip -d repair-build
      - name: Build REPAIR v0.7.2
        run: gradle -p repair-build :app:assembleDebug --stacktrace
      - name: Prepare APK
        run: cp repair-build/app/build/outputs/apk/debug/app-debug.apk MOBIWAY-REPAIR-v0.7.2-ONLINE-BUDGET-FIX.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MOBIWAY-REPAIR-v0.7.2-ONLINE-BUDGET-FIX-APK
          path: MOBIWAY-REPAIR-v0.7.2-ONLINE-BUDGET-FIX.apk
          if-no-files-found: error
          retention-days: 30
